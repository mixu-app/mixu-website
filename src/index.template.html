<!doctype html>
<html lang="{{HTML_LANG}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{PAGE_TITLE}}</title>
    <meta
      name="description"
      content="{{PAGE_DESCRIPTION}}"
    />
    <link rel="canonical" href="{{CANONICAL_URL}}" />

    <!-- OpenGraph -->
    <meta property="og:title" content="{{PAGE_TITLE}}" />
    <meta
      property="og:description"
      content="{{PAGE_DESCRIPTION}}"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://mixuread.com/og.png" />
    <meta property="og:url" content="{{CANONICAL_URL}}" />
    <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
    <meta property="og:locale" content="{{OG_LOCALE}}" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{PAGE_TITLE}}" />
    <meta
      name="twitter:description"
      content="{{PAGE_DESCRIPTION}}"
    />
    <meta name="twitter:image" content="https://mixuread.com/og.png" />

    <link rel="icon" href="{{ASSET_PREFIX}}/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="{{ASSET_PREFIX}}/favicon-small.svg" type="image/svg+xml" sizes="16x16" />
    <link rel="apple-touch-icon" href="{{ASSET_PREFIX}}/apple-touch-icon.png" />
    <link rel="stylesheet" href="{{ASSET_PREFIX}}/style.css" />
  </head>
  <body>
    <main id="app">
      <!-- HERO_CONTENT -->
      <nav class="site-links" aria-label="{{NAV_ARIA_LABEL}}">
        <a class="download-link" href="{{DOWNLOAD_LINK_HREF}}">{{DOWNLOAD_LINK_TEXT}}</a>
      </nav>
    </main>
    <script type="module" src="{{ASSET_PREFIX}}/main.ts"></script>
  </body>
</html>
