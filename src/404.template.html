<!doctype html>
<html lang="{{HTML_LANG}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{PAGE_TITLE}}</title>
    <meta
      name="description"
      content="{{PAGE_DESCRIPTION}}"
    />
    <link rel="canonical" href="{{CANONICAL_URL}}" />

    <!-- OpenGraph -->
    <meta property="og:title" content="{{PAGE_TITLE}}" />
    <meta
      property="og:description"
      content="{{PAGE_DESCRIPTION}}"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://mixu.app/og.png" />
    <meta property="og:url" content="{{CANONICAL_URL}}" />
    <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
    <meta property="og:locale" content="{{OG_LOCALE}}" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{PAGE_TITLE}}" />
    <meta
      name="twitter:description"
      content="{{PAGE_DESCRIPTION}}"
    />
    <meta name="twitter:image" content="https://mixu.app/og.png" />

    <link rel="icon" href="{{ASSET_PREFIX}}/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="{{ASSET_PREFIX}}/favicon-small.svg" type="image/svg+xml" sizes="16x16" />
    <link rel="apple-touch-icon" href="{{ASSET_PREFIX}}/apple-touch-icon.png" />
    <link rel="stylesheet" href="{{ASSET_PREFIX}}/style.css" />
  </head>
  <body>
    <main id="app">
      <nav class="top-nav">
        <a class="nav-link" href="{{NAV_HOME_HREF}}">{{NAV_BACK_HOME}}</a>
      </nav>
      {{LANG_SWITCHER}}
      <img class="mark" src="{{ASSET_PREFIX}}/logo-mark.svg" alt="{{MARK_ALT}}" width="56" height="56" />
      <h1>{{NOT_FOUND_HEADING}}</h1>
      <p class="subhead">
        {{NOT_FOUND_SUBHEAD}}
      </p>

      <section class="callout">
        <h2>{{NOT_FOUND_CALLOUT_TITLE}}</h2>
        <p>
          {{NOT_FOUND_CALLOUT_BODY}}
        </p>
      </section>

      <nav class="site-links error-links" aria-label="{{QUICK_LINKS_LABEL}}">
        <ul>
          <li><a href="{{HOME_LINK_HREF}}">{{HOME_LINK_TEXT}}</a></li>
          <li><a href="{{DOWNLOAD_LINK_HREF}}">{{DOWNLOAD_LINK_TEXT}}</a></li>
          <li>
            <a href="https://github.com/mixu-app/mixu-client" target="_blank" rel="noopener noreferrer">
              {{GITHUB_LINK_TEXT}}
            </a>
          </li>
        </ul>
      </nav>

      <footer class="footer-disclaimers">
        <ul>
{{DISCLAIMERS_HTML}}
        </ul>
      </footer>
    </main>
  </body>
</html>
