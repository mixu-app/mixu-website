<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>谜序 Mixu — 记住每一个线索，推理留给你</title>
    <meta
      name="description"
      content="谜序是一款离线优先的悬疑阅读器：按阅读进度展开的案情板，不剧透、不替你推理。"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-small.svg" type="image/svg+xml" sizes="16x16" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <img class="mark" src="./logo-mark.svg" alt="谜序 Mixu" width="56" height="56" />
      <h1>记住每一个线索，推理留给你。</h1>
      <p>
        谜序是一款离线优先的悬疑阅读器。它把<strong>你已经读到的内容</strong>整理成一张可点击的案情板，
        不登录也能读完一本书。当前处于开发阶段，页面内容以
        <code>content/hero.zh-CN.md</code> 为准。
      </p>
      <p class="note">
        「不剧透」是工程目标：按阅读进度做确定性过滤，并有可失败的回归测试；它不等于数学保证。
      </p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
